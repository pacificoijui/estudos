<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Estudos do Pedrinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F9; --card:#FFFFFF; --ink:#12203A; --ink2:#3E4C63; --muted:#77869C;
  --line:#E4E8EE; --line-soft:#EFF2F6;
  --navy:#173355; --navy-hi:#1E4370;
  --gold:#A07717; --gold-bg:#FBF3E0; --gold-line:#E8D6A8;
  --ok:#1B7A5A; --ok-bg:#EAF5F0; --bad:#AF3A31; --bad-bg:#FBEDEB;
  --r:10px; --sh:0 1px 2px rgba(18,32,58,.05), 0 10px 26px rgba(18,32,58,.06);
  --side:236px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font-family:inherit;font-size:14.5px;color:var(--ink)}
.mono{font-variant-numeric:tabular-nums}
.pf{font-family:'Playfair Display',serif}

/* ================= estrutura ================= */
.shell{display:flex;min-height:100vh}
.side{width:var(--side);flex:none;background:var(--card);border-right:1px solid var(--line);
  position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:22px 14px}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.logo .mk{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-family:'Playfair Display',serif;font-size:15px;font-style:italic;flex:none}
.logo b{font-family:'Playfair Display',serif;font-weight:600;font-size:16px;line-height:1.15;display:block}
.logo span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--ink2);
  font-weight:500;font-size:14px;width:100%;text-align:left;position:relative}
.nav button:hover{background:var(--line-soft)}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button[aria-selected="true"]{background:var(--gold-bg);color:var(--gold);font-weight:600}
.nav button .ct{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.nav button[aria-selected="true"] .ct{color:var(--gold)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
.side-foot button{color:var(--ink2);font-weight:600;font-size:12px}
.side-foot button:hover{color:var(--gold)}

.content{margin-left:var(--side);flex:1;min-width:0;display:flex;flex-direction:column}
.head{padding:26px 34px 0;max-width:1120px;width:100%}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:18px}
.crumb button{color:var(--muted);font-weight:500}
.crumb button:hover{color:var(--gold);text-decoration:underline}
.crumb i{font-style:normal;opacity:.5}
.htitle{display:flex;align-items:flex-end;gap:16px;margin:6px 0 22px;flex-wrap:wrap}
.htitle h1{font-family:'Playfair Display',serif;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.htitle .sub{color:var(--muted);font-size:13.5px;padding-bottom:4px}
.htitle .acts{margin-left:auto;display:flex;gap:9px;padding-bottom:2px}
main{padding:0 34px 60px;max-width:1120px;width:100%;flex:1}

/* ================= peças ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rule{height:1px;background:var(--line);margin:26px 0}
.sec{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.sec .eyebrow{white-space:nowrap}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:8px;
  font-weight:600;font-size:13.5px;background:var(--card);border:1px solid var(--line);color:var(--ink2);
  transition:background .12s,border-color .12s}
.btn:hover{border-color:#CFD6E0;background:#FCFDFE}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#1E4370}
.btn.gold{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.btn.gold:hover{background:#F8EBCE}
.btn.danger{color:var(--bad);border-color:#F0D2CE;background:#fff}
.btn.danger:hover{background:var(--bad-bg)}
.btn.big{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}

.seg{display:inline-flex;background:var(--line-soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(18,32,58,.08)}

.field{display:block;margin:0 0 16px}
.field > .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;
  transition:border-color .12s,box-shadow .12s}
.in:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,51,85,.09)}
textarea.in{resize:vertical;line-height:1.65;min-height:96px}
select.in{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 51%,calc(100% - 12px) 51%;background-size:5px 5px;background-repeat:no-repeat}

/* listas */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line-soft);
  transition:background .12s}
.li:last-child{border-bottom:0}
.li:hover{background:#FAFBFC}
.li .nm{font-weight:600;font-size:14px}
.li .mt{font-size:12.5px;color:var(--muted);margin-top:1px}
.li .arrow{color:#B9C3D0;font-size:17px;flex:none}
.li[aria-current="true"]{background:var(--gold-bg)}
.li[aria-current="true"] .nm{color:var(--gold)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;text-align:left;
  box-shadow:var(--sh);transition:transform .12s,border-color .12s}
.mcard:hover{border-color:#CFD6E0;transform:translateY(-1px)}
.mcard .mk{width:34px;height:34px;border-radius:8px;background:var(--gold-bg);border:1px solid var(--gold-line);color:var(--gold);
  display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:14px;font-weight:600;margin-bottom:12px}
.mcard h3{font-size:16px;margin-bottom:3px}
.mcard .pct{font-family:'Playfair Display',serif;font-size:22px;margin-left:auto;line-height:1}
.dash{border:1px dashed #CFD6E0;background:transparent;box-shadow:none;color:var(--muted);display:flex;align-items:center;
  justify-content:center;gap:8px;font-weight:600;min-height:120px}
.dash:hover{border-color:var(--gold);color:var(--gold);background:#FDFBF5}

.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.ok{background:var(--ok)}.bar i.bad{background:var(--bad)}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh)}
.kpi .n{font-family:'Playfair Display',serif;font-size:32px;line-height:1;color:var(--navy)}
.kpi .l{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:700}
.spark{display:flex;align-items:flex-end;gap:5px;height:88px}
.spark div{flex:1;background:var(--navy);opacity:.85;border-radius:2px 2px 0 0;min-height:2px}
.spark div.z{background:var(--line);opacity:1}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}

.empty{text-align:center;padding:52px 24px;border:1px dashed #D5DCE5;border-radius:var(--r);background:var(--card)}
.empty .big{font-family:'Playfair Display',serif;font-size:21px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:13.5px;margin:0 auto 18px;max-width:420px}

.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#C9E4D8;background:var(--ok-bg)}
.pill.bad{color:var(--bad);border-color:#F0D2CE;background:var(--bad-bg)}
.pill.gold{color:var(--gold);border-color:var(--gold-line);background:var(--gold-bg)}

/* duas colunas */
.split{display:grid;grid-template-columns:262px 1fr;gap:26px;align-items:start}
/* sem min-width:0 a coluna cresce até caber a barra de formatação inteira,
   e aí o celular diminui o zoom da página toda para dar conta */
.split>*{min-width:0}
.pane{position:sticky;top:24px}

/* notas */
/* sem overflow:hidden — senão a barra de formatação não gruda no topo */
.notes{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.notes .nh{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-soft);
  background:#FCFDFE;border-radius:var(--r) var(--r) 0 0;flex-wrap:wrap}
.notes .nf{display:flex;gap:14px;justify-content:flex-end;padding:11px 18px;border-top:1px solid var(--line-soft);
  background:#FCFDFE;border-radius:0 0 var(--r) var(--r)}
.notes .nf button{font-size:12.5px;font-weight:600;color:var(--muted)}
.notes .nf button:hover{color:var(--ink)}
.notes .nf button.rm:hover{color:var(--bad)}
.nome-ed{display:inline-flex;align-items:center;gap:7px;max-width:100%;font-weight:700;font-size:15px;
  padding:2px 6px;margin-left:-6px;border-radius:6px;color:var(--ink)}
.nome-ed:hover{background:var(--line-soft)}
.nome-ed .lapis{color:var(--muted);font-size:12.5px;flex:none}
.nome-ed:hover .lapis{color:var(--gold)}
.st-name{width:230px;flex:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-num{width:130px;text-align:right}
.st-pct{width:58px;text-align:center}

/* prática */
.stage{max-width:760px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.qhead .bar{flex:1}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 28px;box-shadow:var(--sh)}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.enun{font-size:16.5px;line-height:1.7;white-space:pre-wrap;margin-bottom:20px;color:var(--ink)}
.alt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;margin-bottom:9px;
  border:1px solid var(--line);border-radius:9px;background:var(--card);line-height:1.55;transition:.12s}
.alt:hover:not(:disabled){border-color:var(--navy);background:#FAFCFE}
.alt .L{font-family:'Playfair Display',serif;font-size:14px;width:26px;height:26px;flex:none;border-radius:6px;
  display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);background:var(--line-soft);font-weight:600}
.alt:hover:not(:disabled) .L{border-color:var(--navy);color:var(--navy)}
.alt.ok{border-color:var(--ok);background:var(--ok-bg)}
.alt.ok .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.alt.no{border-color:var(--bad);background:var(--bad-bg)}
.alt.no .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.alt.dim{opacity:.5}
.alt:disabled{cursor:default}
/* comentário preso à alternativa: fica logo abaixo dela, então não depende de letra */
.altcom{margin:-4px 0 11px 0;padding:9px 13px 9px 40px;border-radius:0 0 9px 9px;font-size:13.5px;line-height:1.55;
  color:var(--ink2);background:#FBFCFD;border:1px solid var(--line);border-top:0;white-space:pre-wrap}
.altcom.ok{border-color:#C9E4D8;background:var(--ok-bg)}
.altcom.no{border-color:#F0D2CE;background:var(--bad-bg)}
.altcom.dim{opacity:.62}
.altcom b.lt{font-weight:700;color:var(--ink)}
.fb{margin-top:18px;padding:15px 17px;border-radius:9px;border:1px solid var(--line);background:#FBFCFD}
.fb.ok{border-color:#C9E4D8;background:var(--ok-bg)}
.fb.no{border-color:#F0D2CE;background:var(--bad-bg)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb.ok .h{color:var(--ok)}.fb.no .h{color:var(--bad)}
.fb p{margin:0;font-size:14px;line-height:1.6;white-space:pre-wrap;color:var(--ink2)}
.kbd{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;background:var(--card);font-family:inherit}

/* modal */
.veil{position:fixed;inset:0;z-index:80;background:rgba(18,32,58,.34);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:44px 20px;overflow:auto}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(18,32,58,.24);
  animation:pop .16s ease both}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-soft)}
.modal .mh h2{font-family:'Playfair Display',serif;font-size:19px}
.modal .mb{padding:20px 22px;max-height:64vh;overflow:auto}
.modal .mf{display:flex;gap:9px;justify-content:flex-end;padding:15px 22px;border-top:1px solid var(--line-soft);background:#FCFDFE;border-radius:0 0 12px 12px}
.x{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);margin-left:auto}
.x:hover{background:var(--line-soft);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);z-index:90;opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;border-radius:8px;padding:10px 17px;font-size:13.5px;transition:.2s;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= editor de anotações ================= */
.ed{display:flex;flex-direction:column}
.edbar{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 10px;background:#FCFDFE;
  border-bottom:1px solid var(--line-soft);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.edbar::-webkit-scrollbar{display:none}
.edb{flex:none;min-width:36px;height:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;
  color:var(--ink2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.edb:hover{background:var(--line-soft)}
.edb[aria-pressed="true"]{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.edb b{font-size:15px}.edb i{font-family:'Playfair Display',serif;font-size:15px}
.edb .mk-hl{background:#FBF0C4;padding:0 4px;border-radius:3px}
.edsep{flex:none;width:1px;margin:6px 4px;background:var(--line)}
.edarea{padding:22px 26px;min-height:56vh;line-height:1.8;font-size:15px;outline:none;overflow-wrap:break-word}
.edarea:empty:before{content:attr(data-ph);color:#AAB6C6}
.edarea h3{font-family:'Playfair Display',serif;font-size:19px;margin:18px 0 6px}
.edarea h3:first-child{margin-top:0}
.edarea ul,.edarea ol{margin:8px 0;padding-left:24px}
.edarea li{margin:3px 0}
.edarea mark{background:#FBF0C4;color:inherit;padding:1px 2px;border-radius:3px}
.edarea blockquote{margin:10px 0;padding:4px 0 4px 14px;border-left:3px solid var(--gold-line);color:var(--ink2)}
.edarea code{background:var(--line-soft);border-radius:4px;padding:1px 5px;font-size:13.5px}
.edarea a{color:var(--navy)}
.nota-ro{line-height:1.8}
.nota-ro mark{background:#FBF0C4;padding:1px 2px;border-radius:3px}

/* ================= login e sincronização ================= */
.gate{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;justify-content:center;padding:20px;overflow:auto}
.gate[hidden]{display:none}  /* sem isto o display:flex vence o atributo hidden e a tela invisível engole os cliques */
/* margin:auto no lugar de align-items:center — assim, com o teclado aberto
   numa tela baixa, dá para rolar o cartão em vez de ele ficar cortado */
.gate-card{margin:auto;width:100%;max-width:370px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 26px;box-shadow:var(--sh);text-align:center}
.gate-card .mk{width:44px;height:44px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-family:'Playfair Display',serif;font-size:20px;font-style:italic;margin:0 auto 16px}
.gate-card h1{font-family:'Playfair Display',serif;font-size:21px;margin-bottom:4px}
.gate-card p{color:var(--muted);font-size:13px;margin:0 0 22px}
.gate-card .field{text-align:left}
.gate-err{font-size:13px;margin:-4px 0 14px;min-height:17px;color:var(--bad)}
.gate-err.ok{color:var(--ok)}
.gate-card .btn{width:100%}
.gate-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px}
.gate-links button{color:var(--muted);font-weight:600}
.gate-links button:hover{color:var(--gold)}
.gate-local{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.gate-local button{color:var(--ink2);font-weight:600}
.gate-local button:hover{color:var(--gold)}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync.on i{background:var(--ok)}
.sync.off i{background:var(--bad)}
.sync.wait i{background:var(--gold)}
.gear{display:none;margin-left:auto;width:36px;height:36px;border-radius:9px;place-items:center;color:var(--ink2);flex:none}
.gear:hover{background:var(--line-soft)}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line-soft);font-weight:600;color:var(--ink2)}
.opt:last-child{border-bottom:0}
.opt .mt{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500}

/* ================= responsivo ================= */
@media (max-width:900px){
  /* min-width:0 é essencial: sem isso a barra de cima (mais larga que a tela)
     estica a página inteira e o celular responde diminuindo o zoom de tudo */
  .side{position:static;width:auto;min-width:0;flex-direction:row;align-items:center;gap:4px;padding:10px 12px;
    border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .side::-webkit-scrollbar{display:none}
  .side{scrollbar-width:none}
  .shell{flex-direction:column}
  .content{margin-left:0}
  .logo{padding:0 10px 0 2px}.logo span{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button .ct{display:none}
  .side-foot{display:none}
  /* fica colado na direita enquanto o resto da barra rola */

<script>
(function(){
'use strict';
var KEY='estudos_do_pedrinho_v1', KEY_LOCAL='estudos_do_pedrinho_modo_local', LETRAS='ABCDE';
var S={materias:[],submaterias:[],questoes:[],hist:[],apagados:{}};
var pilha=[{v:'materias',p:{}}], sessao=null, rascunho=null, modal=null;
var setup={materiaId:null,submateriaId:null,modo:'todas',qtd:10};
var api=null, usuario=null, modoLocal=false, primeiraNuvem=true;

var el=function(i){return document.getElementById(i)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function embaralhar(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function toast(m){var t=el('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2400);}
function dia(d){return (d||new Date()).toISOString().slice(0,10);}
function sigla(n){var p=String(n||'?').trim().split(/\s+/);return (p.length>1?(p[0][0]+p[1][0]):String(n).slice(0,2)).toUpperCase();}
function corte(t,n){t=String(t||'');return esc(t.length>n?t.slice(0,n)+'…':t);}

/* ---------------- anotações com formatação ----------------
   As anotações agora guardam HTML. Como o texto pode vir da nuvem ou de
   um "colar", tudo passa por uma peneira que só deixa passar as marcações
   de formatação — nada de script, imagem ou evento. */
var TAGS_OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,MARK:1,H3:1,H4:1,P:1,DIV:1,BR:1,
  UL:1,OL:1,LI:1,BLOCKQUOTE:1,CODE:1,PRE:1,SPAN:1,FONT:1,A:1};
var ESTILO_OK=/^\s*(background-color|color|font-weight|font-style|text-decoration[a-z-]*)\s*:/i;
function docInerte(html){var d=document.implementation.createHTMLDocument('');d.body.innerHTML=String(html||'');return d;}
function limpaHtml(html){
  var d=docInerte(html);
  (function anda(pai){
    [].slice.call(pai.childNodes).forEach(function(n){
      if(n.nodeType===3) return;
      if(n.nodeType!==1){pai.removeChild(n);return;}
      anda(n);
      if(!TAGS_OK[n.tagName]){ /* tag não permitida sai, mas o texto dela fica */
        while(n.firstChild) pai.insertBefore(n.firstChild,n);
        pai.removeChild(n); return;
      }
      [].slice.call(n.attributes).forEach(function(at){
        var nome=at.name.toLowerCase(), val=String(at.value||'');
        var fica=(n.tagName==='A'&&nome==='href'&&/^(https?:|mailto:)/i.test(val.trim()))
          || (nome==='style'&&val.split(';').every(function(p){return !p.trim()||ESTILO_OK.test(p);})
              &&!/url\s*\(|expression|javascript:/i.test(val));
        if(!fica) n.removeAttribute(at.name);
      });
      if(n.tagName==='A'){n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer');}
    });
  })(d.body);
  return d.body.innerHTML;
}
function htmlParaTexto(h){return (docInerte(h).body.textContent||'').trim();}
function textoParaHtml(t){
  return String(t||'').split('\n').map(function(l){return '<div>'+(l?esc(l):'<br>')+'</div>';}).join('');
}
/* anotações antigas eram texto puro; só as novas trazem fmt:'html' */
function notasHtml(s){if(!s) return '';return s.fmt==='html'?limpaHtml(s.anotacoes):textoParaHtml(s.anotacoes);}
function temNotas(s){return (s&&s.fmt==='html'?htmlParaTexto(s.anotacoes):String((s&&s.anotacoes)||'').trim()).length>0;}

/* ---------------- armazenamento ----------------
   Local primeiro: tudo cai no localStorage na hora e, quando há login,
   sobe para o Firestore. Os dois lados são mesclados por id + data de
   alteração, então o que foi escrito no celular e no computador se junta
   em vez de um apagar o outro. */
var agora=function(){return Date.now()};
function marcar(r){if(r)r.atualizadoEm=agora();return r;}
function apagado(id){S.apagados[id]=agora();}
function quando(r){return r.atualizadoEm||r.criadoEm||0;}
function normalizar(d){
  return {materias:(d&&d.materias)||[],submaterias:(d&&d.submaterias)||[],
    questoes:(d&&d.questoes)||[],hist:(d&&d.hist)||[],apagados:(d&&d.apagados)||{}};
}
function podarApagados(t){var lim=agora()-120*86400000,o={};
  for(var k in t){if(t[k]>lim)o[k]=t[k];} return o;}
function mesclarHist(a,b){
  a=a||[];b=b||[];
  var vistos={},novos=[],legA=[],legB=[];
  [[a,legA],[b,legB]].forEach(function(par){
    par[0].forEach(function(r){
      if(!r) return;
      if(r.i){if(!vistos[r.i]){vistos[r.i]=1;novos.push(r);}}
      else par[1].push(r);
    });
  });
  /* registros antigos não têm id e as duas cópias vieram da mesma origem:
     ficamos com a lista mais completa em vez de somar as duas */
  var saida=(legA.length>=legB.length?legA:legB).concat(novos);
  return saida.length>4000?saida.slice(-3000):saida;
}
function mesclar(a,b){
  a=normalizar(a); b=normalizar(b);
  var tumbas={};
  [a.apagados,b.apagados].forEach(function(t){
    for(var k in t){if(!tumbas[k]||t[k]>tumbas[k])tumbas[k]=t[k];}
  });
  var saida={materias:[],submaterias:[],questoes:[],hist:[],apagados:podarApagados(tumbas)};
  ['materias','submaterias','questoes'].forEach(function(col){
    var idx={};
    [a[col],b[col]].forEach(function(lista){
      lista.forEach(function(r){
        if(!r||!r.id) return;
        if(!idx[r.id]||quando(r)>quando(idx[r.id])) idx[r.id]=r;
      });
    });
    Object.keys(idx).forEach(function(id){
      var r=idx[id];
      if(tumbas[id]&&tumbas[id]>=quando(r)) return; /* apagado depois da última edição */
      saida[col].push(r);
    });
    saida[col].sort(function(x,y){return (x.criadoEm||0)-(y.criadoEm||0);});
  });
  saida.hist=mesclarHist(a.hist,b.hist);
  return saida;
}
function guardarLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
/* ao fechar a aba, junta com o que estiver gravado: se outra aba salvou
   algo mais novo no meio tempo, ninguém sobrescreve ninguém */
function guardarComCuidado(){
  try{var raw=localStorage.getItem(KEY); if(raw) S=mesclar(S,JSON.parse(raw));}catch(e){}
  guardarLocal();
}
function salvar(){clearTimeout(salvar._t);salvar._t=setTimeout(function(){
  guardarLocal();
  enviarNuvem();
},250);}
function enviarNuvem(){
  if(!api||!usuario) return;
  var pacote={materias:S.materias,submaterias:S.submaterias,questoes:S.questoes,hist:S.hist,apagados:S.apagados};
  if(JSON.stringify(pacote).length>900000){  /* limite de 1 MB por documento no Firestore */
    status('off','dados grandes demais para a nuvem'); return;
  }
  status('wait','enviando…');
  api.enviar(pacote)
    .then(function(){status('on','tudo sincronizado');})
    .catch(function(){status('off','salvo aqui, sem enviar');});
}
function carregar(){
  var local=null; try{var raw=localStorage.getItem(KEY);if(raw)local=JSON.parse(raw);}catch(e){}
  if(local) S=normalizar(local);
  try{modoLocal=localStorage.getItem(KEY_LOCAL)==='1';}catch(e){}
  desenhar();
}

/* ---------------- sincronização entre aparelhos ---------------- */
function status(cl,txt){
  var s=el('sync'); if(!s) return;
  s.className='sync '+(cl||'');
  el('syncTxt').textContent=txt;
  status._cl=cl; status._txt=txt;
}
function editando(){var a=document.activeElement;return !!(a&&(a.id==='anot'||a.id==='mdIn'||(a.closest&&a.closest('.modal'))));}
function gate(mostrar){
  var g=el('gate'); if(!g) return;
  g.hidden=!mostrar;
  if(mostrar){var e=el('gEmail'); if(e&&!e.value) setTimeout(function(){try{e.focus();}catch(x){}},60);}
}
function erroGate(msg,ok){var e=el('gErr'); if(e){e.textContent=msg||'';e.className='gate-err'+(ok?' ok':'');}}
window.EstudosSync={
  /* chamado pelo módulo do Firebase quando ele termina de carregar */
  pronto:function(a){api=a;},
  /* mudou o login */
  auth:function(u){
    usuario=u;
    if(u){
      modoLocal=false; try{localStorage.removeItem(KEY_LOCAL);}catch(e){}
      primeiraNuvem=true;
      gate(false); erroGate('');
      status('wait','sincronizando…');
    } else {
      status('off','só neste aparelho');
      if(!modoLocal) gate(true);
    }
    desenhar();
  },
  /* chegou o documento da nuvem (null = ainda não existe lá) */
  dados:function(remoto){
    if(remoto){
      var antes=JSON.stringify(S);
      S=mesclar(S,remoto);
      guardarLocal();
      status('on','tudo sincronizado');
      if(antes!==JSON.stringify(S)){
        if(primeiraNuvem||!editando()) desenhar();
        /* se a primeira mescla mudou algo, a nuvem ainda não tem o que é daqui */
        if(primeiraNuvem) enviarNuvem();
      }
    } else {
      /* primeira vez nesta conta: manda para cima o que já existe aqui */
      enviarNuvem();
    }
    primeiraNuvem=false;
  },
  /* usado na migração dos dados antigos */
  forcarEnvio:function(){enviarNuvem();},
  /* o Firebase não carregou (offline, bloqueado, etc.) */
  falhou:function(){
    api=null;
    status('off','sem conexão — salvo neste aparelho');
  }
};

/* ---------------- consultas ---------------- */
function mat(id){return S.materias.filter(function(m){return m.id===id})[0];}
function sbm(id){return S.submaterias.filter(function(s){return s.id===id})[0];}
function qst(id){return S.questoes.filter(function(q){return q.id===id})[0];}
function subsDe(id){return S.submaterias.filter(function(s){return s.materiaId===id});}
function qsDe(id){return S.questoes.filter(function(q){return q.materiaId===id});}
function qsDeSub(id){return S.questoes.filter(function(q){return q.submateriaId===id});}
function stat(l){var a=0,e=0;l.forEach(function(q){a+=q.acertos||0;e+=q.erros||0;});return{a:a,e:e,t:a+e,p:(a+e)?Math.round(a*100/(a+e)):null};}
function nomeLocal(q){var m=mat(q.materiaId),s=q.submateriaId?sbm(q.submateriaId):null;return (m?m.nome:'sem matéria')+(s?' · '+s.nome:'');}
function plural(n,s,p){return n+' '+(n===1?s:p);}

/* ---------------- navegação ---------------- */
function ir(v,p){pilha.push({v:v,p:p||{}});desenhar();scroll(0,0);}
function trocar(v,p){pilha[pilha.length-1]={v:v,p:p||{}};desenhar();scroll(0,0);}
function voltar(){if(pilha.length>1){pilha.pop();desenhar();scroll(0,0);}}
function raiz(v){pilha=[{v:v,p:{}}];desenhar();scroll(0,0);}
function atual(){return pilha[pilha.length-1];}
function scroll(){try{window.scrollTo(0,0);}catch(e){}}

/* ---------------- modal ---------------- */
function abrirModal(html){modal=true;el('modalHost').innerHTML='<div class="veil" id="veil"><div class="modal">'+html+'</div></div>';
  var f=el('mdIn');if(f){f.focus();f.select();}}
function fecharModal(){modal=null;el('modalHost').innerHTML='';}
function pedirTexto(titulo,rotulo,valor,acao){
  abrirModal('<div class="mh"><h2>'+esc(titulo)+'</h2><button class="x" data-a="fecharModal">&#10005;</button></div>'+
    '<div class="mb"><label class="field"><span class="lab">'+esc(rotulo)+'</span>'+
    '<input class="in" id="mdIn" value="'+esc(valor||'')+'" data-enter="'+acao+'"></label></div>'+
    '<div class="mf"><button class="btn" data-a="fecharModal">Cancelar</button>'+
    '<button class="btn primary" data-a="'+acao+'">Salvar</button></div>');
}
function confirmar(titulo,texto,acao,id,rotulo){
  abrirModal('<div class="mh"><h2>'+esc(titulo)+'</h2><button class="x" data-a="fecharModal">&#10005;</button></div>'+
    '<div class="mb"><p style="margin:0;color:var(--ink2)">'+esc(texto)+'</p></div>'+
    '<div class="mf"><button class="btn" data-a="fecharModal">Cancelar</button>'+
    '<button class="btn danger" data-a="'+acao+'" data-id="'+(id||'')+'">'+esc(rotulo||'Excluir')+'</button></div>');
}

/* ---------------- render ---------------- */
function desenhar(){
  var a=atual(), crumb='', titulo='', sub='', acts='', html='';
  var abas={materias:'materias',materia:'materias',questoes:'questoes',praticar:'praticar',sessao:'praticar',resumo:'praticar',stats:'stats'};
  [].forEach.call(document.querySelectorAll('.nav button'),function(b){b.setAttribute('aria-selected',abas[a.v]===b.dataset.tab?'true':'false');});
  el('ctM').textContent=S.materias.length||'';
  el('ctQ').textContent=S.questoes.length||'';
  var g=stat(S.questoes); el('ctA').textContent=(g.p===null?'':g.p+'%');

  if(a.v==='materias'){titulo='Matérias';sub=S.materias.length?plural(S.materias.length,'matéria','matérias')+' · '+plural(S.questoes.length,'questão','questões'):'';
    acts='<button class="btn primary" data-a="novaMateria">Nova matéria</button>';html=vMaterias();}
  else if(a.v==='materia'){var m=mat(a.p.id);if(!m){voltar();return;}
    var st=stat(qsDe(m.id));
    crumb='<button data-a="tab" data-t="materias">Matérias</button><i>/</i><span>'+esc(m.nome)+'</span>';
    titulo=esc(m.nome);
    sub=plural(subsDe(m.id).length,'submatéria','submatérias')+' · '+plural(qsDe(m.id).length,'questão','questões')+(st.p!==null?' · '+st.p+'% de acerto':'');
    acts='<button class="btn" data-a="renomearMateria" data-id="'+m.id+'">Renomear</button>'+
         '<button class="btn" data-a="novaQuestao" data-mid="'+m.id+'">Nova questão</button>'+
         '<button class="btn primary" data-a="praticarMateria" data-id="'+m.id+'">Praticar</button>';
    html=vMateria(m);}
  else if(a.v==='questoes'){titulo='Questões';sub=plural(S.questoes.length,'questão cadastrada','questões cadastradas');
    acts='<button class="btn primary" data-a="novaQuestao">Nova questão</button>';html=vQuestoes();}
  else if(a.v==='praticar'){titulo='Praticar';sub='A ordem das questões e das alternativas muda a cada rodada';html=vPraticar();}
  else if(a.v==='sessao'){titulo='Rodada em andamento';html=vSessao();}
  else if(a.v==='resumo'){titulo='Resultado da rodada';html=vResumo();}
  else if(a.v==='stats'){titulo='Números';sub='Seu desempenho até aqui';html=vStats();}

  el('crumb').innerHTML=crumb;
  el('htitle').innerHTML='<h1>'+titulo+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+(acts?'<div class="acts">'+acts+'</div>':'');
  el('main').innerHTML=html;
  if(a.v==='materia'&&a.p.sub) ligarAnotacoes();
}

/* ---------- matérias ---------- */
function vMaterias(){
  if(!S.materias.length) return '<div class="empty"><div class="big">Nenhuma matéria ainda</div>'+
    '<p>Crie uma matéria, divida em submatérias, escreva as anotações das aulas e cadastre as questões para praticar.</p>'+
    '<button class="btn primary big" data-a="novaMateria">Criar primeira matéria</button> '+
    '<button class="btn big" data-a="exemplo">Ver um exemplo</button></div>';
  var h='<div class="grid">';
  S.materias.forEach(function(m){
    var st=stat(qsDe(m.id)),ns=subsDe(m.id).length,nq=qsDe(m.id).length,tot=st.t||1;
    h+='<button class="mcard" data-a="abrirMateria" data-id="'+m.id+'">'+
      '<div class="row" style="align-items:flex-start"><div class="mk">'+esc(sigla(m.nome))+'</div>'+

var BOTOES=[
  {f:'bold',h:'<b>N</b>',t:'Negrito'},
  {f:'italic',h:'<i>I</i>',t:'Itálico'},
  {f:'underline',h:'<u>S</u>',t:'Sublinhado'},

  {sep:1},
  {f:'formatBlock',v:'h3',h:'Título',t:'Título'},
  {f:'insertUnorderedList',h:'• Lista',t:'Lista'},
  {f:'insertOrderedList',h:'1. Lista',t:'Lista numerada'},
  {f:'formatBlock',v:'blockquote',h:'❝ Citação',t:'Citação'},

  {f:'removeFormat',h:'Limpar',t:'Tirar a formatação'}
];
function barraFormato(){

  BOTOES.forEach(function(b){
    if(b.sep){h+='<span class="edsep"></span>';return;}

       ' title="'+esc(b.t)+'" aria-label="'+esc(b.t)+'" aria-pressed="false">'+b.h+'</button>';

function noEditor(){
  var sel=window.getSelection(); if(!sel||!sel.anchorNode) return null;
  var n=sel.anchorNode; n=n.nodeType===1?n:n.parentNode;
  var ed=el('anot');
  return (ed&&n&&ed.contains(n))?n:null;
}
function blocoAtual(){
  var n=noEditor(), ed=el('anot');
  while(n&&n!==ed){ if(/^(H3|H4|BLOCKQUOTE|P)$/.test(n.tagName)) return n.tagName; n=n.parentNode; }
  return '';
}
function temMarca(){
  var n=noEditor(), ed=el('anot');
  while(n&&n!==ed){
    if(n.tagName==='MARK') return true;
    var bg=(n.style&&n.style.backgroundColor)||'';
    if(bg&&bg!=='transparent'&&bg.indexOf('rgba(0, 0, 0, 0)')<0) return true;
    n=n.parentNode;
  }
  return false;
}
function formatar(f,v){
  try{
    if(f==='marca'){
      var tirar=temMarca();
      try{document.execCommand('styleWithCSS',false,true);}catch(e){}
      if(!document.execCommand('hiliteColor',false,tirar?'transparent':v))
        document.execCommand('backColor',false,tirar?'transparent':v);
      try{document.execCommand('styleWithCSS',false,false);}catch(e){}
      return;
    }
    if(f==='formatBlock'){
      var igual=blocoAtual()===String(v).toUpperCase();
      document.execCommand('formatBlock',false,igual?'div':v);
      return;
    }
    document.execCommand(f,false,v||null);
  }catch(e){}
}
function atualizarBarra(){
  var barra=el('edbar'); if(!barra) return;
  [].forEach.call(barra.querySelectorAll('[data-f]'),function(b){
    var f=b.dataset.f, on=false;
    try{
      if(f==='marca') on=temMarca();
      else if(f==='formatBlock') on=blocoAtual()===String(b.dataset.v||'').toUpperCase();
      else if(f!=='removeFormat') on=document.queryCommandState(f);
    }catch(e){}
    b.setAttribute('aria-pressed',on?'true':'false');
  });
}
function ligarAnotacoes(){
  var ed=el('anot'), barra=el('edbar'), id=atual().p.sub;
  if(!ed||!sbm(id)) return;
  ed.innerHTML=notasHtml(sbm(id));

  var guardar=function(){
    var s=sbm(id); if(!s) return;                 /* busca de novo: a mescla troca o objeto */
    s.anotacoes=limpaHtml(ed.innerHTML); s.fmt='html'; marcar(s);
    var f=el('flag'); if(f){f.textContent='salvo';clearTimeout(f._t);f._t=setTimeout(function(){f.textContent='';},1600);}
    salvar();
  };
  ed.addEventListener('input',guardar);
  ed.addEventListener('blur',guardar);
  ed.addEventListener('paste',function(ev){
    var cb=ev.clipboardData||window.clipboardData; if(!cb) return;
    var html=cb.getData('text/html'), txt=cb.getData('text/plain');
    ev.preventDefault();
    try{document.execCommand('insertHTML',false,html?limpaHtml(html):textoParaHtml(txt));}
    catch(e){try{document.execCommand('insertText',false,txt||'');}catch(x){}}
    guardar();
  });
  ['keyup','pointerup','focus'].forEach(function(e){ed.addEventListener(e,atualizarBarra);});

  if(!barra) return;
  /* o pointerdown com preventDefault é o que segura a seleção no celular:
     sem isso o teclado fecha e o trecho selecionado se perde ao tocar no botão */
  var viaPonteiro=false;
  var agir=function(ev,b){
    ev.preventDefault();
    if(document.activeElement!==ed) ed.focus();
    formatar(b.dataset.f,b.dataset.v);
    guardar(); atualizarBarra();
  };
  barra.addEventListener('pointerdown',function(ev){
    var b=ev.target.closest&&ev.target.closest('[data-f]'); if(!b) return;
    viaPonteiro=true; setTimeout(function(){viaPonteiro=false;},500);
    agir(ev,b);
  });
  barra.addEventListener('mousedown',function(ev){ev.preventDefault();});
  barra.addEventListener('click',function(ev){
    var b=ev.target.closest&&ev.target.closest('[data-f]'); if(!b) return;
    ev.preventDefault();
    if(viaPonteiro){viaPonteiro=false;return;}   /* já tratado no pointerdown */
    agir(ev,b);
  });
}

function poolDe(){
  var base=setup.submateriaId?qsDeSub(setup.submateriaId):(setup.materiaId?qsDe(setup.materiaId):S.questoes.slice());
  base=base.filter(function(q){return q.alternativas&&q.alternativas.length>=2;});
  if(setup.modo==='erros') base=base.filter(function(q){return (q.erros||0)>0;});
  if(setup.modo==='novas') base=base.filter(function(q){return !((q.acertos||0)+(q.erros||0));});
  if(setup.modo==='ultima') base=base.filter(function(q){return q.ultimaCorreta===false;});
  return base;
}

function comecar(){
  var pool=poolDe();
  if(!pool.length){toast('Nenhuma questão nesse filtro');return;}
  if(setup.modo==='erros'){
    pool.sort(function(a,b){var ra=(a.erros||0)/Math.max(1,(a.acertos||0)+(a.erros||0)),rb=(b.erros||0)/Math.max(1,(b.acertos||0)+(b.erros||0));return rb-ra;});
    pool=pool.slice(0,Math.max(setup.qtd,10));
  }
  sessao={fila:embaralhar(pool).slice(0,setup.qtd),i:0,respostas:[],ordem:null,resp:null,puladas:[]};
  ir('sessao',{});
}

function vSessao(){
  var q=sessao&&sessao.fila[sessao.i];
  if(q) q=qst(q.id)||q;              /* a mescla pode ter trocado o objeto */
  if(!q) return vResumo();
  if(!sessao.ordem) sessao.ordem=embaralhar(q.alternativas);
  var pct=Math.round(sessao.i*100/sessao.fila.length);
  var acertos=sessao.respostas.filter(function(r){return r.ok}).length;
  var h='<div class="stage"><div class="qhead"><span class="pf mono" style="font-size:15px">'+(sessao.i+1)+' <span class="muted">de '+sessao.fila.length+'</span></span>'+
    '<div class="bar"><i class="ok" style="width:'+pct+'%"></i></div>'+
    '<span class="pill ok">'+acertos+' ✓</span><span class="pill bad">'+(sessao.respostas.length-acertos)+' ✗</span>'+
    ((sessao.puladas&&sessao.puladas.length)?'<span class="pill">'+sessao.puladas.length+' pulada'+(sessao.puladas.length===1?'':'s')+'</span>':'')+
    '<button class="btn" data-a="encerrar">Encerrar</button></div>';
  h+='<div class="qbox"><div class="qmeta"><span class="pill">'+esc(nomeLocal(q))+'</span>'+
    (q.fonte?'<span class="pill">'+esc(q.fonte)+'</span>':'')+'<span class="pill gold">alternativas embaralhadas</span></div>';
  h+='<div class="enun">'+esc(q.enunciado)+'</div>';
  sessao.ordem.forEach(function(a,i){
    var estado='';
    if(sessao.resp){ estado = a.correta?'ok' : (sessao.resp===a.id?'no':'dim'); }
    var com=String(a.comentario||'').trim();
    h+='<button class="alt'+(estado?' '+estado:'')+'" data-a="responder" data-id="'+a.id+'"'+(sessao.resp?' disabled':'')+
      (com?' style="margin-bottom:0;border-radius:9px 9px 0 0"':'')+'>'+
      '<span class="L">'+LETRAS[i]+'</span><span class="grow">'+esc(a.texto)+'</span></button>';
    /* a letra vem de sessao.ordem, o embaralhamento desta rodada — nunca da ordem de cadastro */
    if(sessao.resp&&com)
      h+='<div class="altcom'+(estado?' '+estado:'')+'"><b class="lt">'+LETRAS[i]+')</b> '+esc(com)+'</div>';
  });
  if(sessao.resp){
    var certa=sessao.ordem.filter(function(a){return a.correta})[0];
    var ok=certa&&certa.id===sessao.resp, letra=LETRAS[sessao.ordem.indexOf(certa)];
    h+='<div class="fb '+(ok?'ok':'no')+'"><div class="h">'+(ok?'Acertou':'Errou — a certa era a letra '+letra)+'</div>'+
      (q.comentario?'<p>'+esc(q.comentario)+'</p>':'')+
      '<p style="color:var(--muted);font-size:12.5px;margin-top:8px">Nesta questão você já tem '+(q.acertos||0)+' acertos e '+(q.erros||0)+' erros.</p></div>';
    h+='<div class="row" style="margin-top:18px"><span class="sub dica">Atalho: <span class="kbd">Enter</span></span>'+
      '<button class="btn primary" style="margin-left:auto" data-a="proxima">'+(sessao.i+1<sessao.fila.length?'Próxima questão':'Ver resultado')+'</button></div>';
  } else {
    h+='<div class="row" style="margin-top:16px;flex-wrap:wrap;gap:10px"><span class="sub dica">Atalho: <span class="kbd">1</span>…<span class="kbd">'+sessao.ordem.length+'</span> ou <span class="kbd">A</span>…<span class="kbd">'+LETRAS[sessao.ordem.length-1]+'</span> para responder, <span class="kbd">S</span> para pular</span>'+
      '<button class="btn" style="margin-left:auto" data-a="pular">Pular questão</button></div>';
  }
  return h+'</div></div>';
}
function responder(altId){
  var q=qst(sessao.fila[sessao.i].id)||sessao.fila[sessao.i];  /* a mescla pode ter trocado o objeto */
  /* vale o que está na tela: sessao.ordem é o que a pessoa realmente viu */
  var certa=(sessao.ordem||q.alternativas).filter(function(a){return a.correta})[0];
  var ok=!!certa&&certa.id===altId;
  sessao.resp=altId; sessao.respostas.push({id:q.id,ok:ok});
  q.acertos=q.acertos||0; q.erros=q.erros||0;
  if(ok) q.acertos++; else q.erros++;
  q.ultimaCorreta=ok; q.ultimaVez=Date.now(); marcar(q);
  S.hist.push({d:dia(),c:ok?1:0,i:uid()});
  if(S.hist.length>4000) S.hist=S.hist.slice(-3000);
  salvar(); desenhar();
}
function proxima(){
  sessao.i++; sessao.resp=null; sessao.ordem=null;
  if(sessao.i>=sessao.fila.length) trocar('resumo',{}); else desenhar();
}
function pular(){
  if(!sessao||sessao.resp) return;
  var q=sessao.fila[sessao.i];
  if(q){ sessao.puladas=sessao.puladas||[]; sessao.puladas.push(q.id); }
  sessao.i++; sessao.resp=null; sessao.ordem=null;
  if(sessao.i>=sessao.fila.length) trocar('resumo',{}); else desenhar();
}
function refazerPuladas(){
  var fila=embaralhar((sessao.puladas||[]).map(function(id){return qst(id);}).filter(Boolean));
  if(!fila.length){toast('Nenhuma pulada para refazer');return;}
  sessao={fila:fila,i:0,respostas:[],ordem:null,resp:null,puladas:[]};
  trocar('sessao',{});
}
function vResumo(){
  var r=sessao?sessao.respostas:[], pul=sessao?(sessao.puladas||[]):[];
  var a=r.filter(function(x){return x.ok}).length, e=r.length-a, p=r.length?Math.round(a*100/r.length):0;
  var h='<div class="stage"><div class="card" style="text-align:center;padding:34px">'+
    '<div class="eyebrow">Aproveitamento</div>'+
    '<div class="pf mono" style="font-size:64px;line-height:1;margin:10px 0;color:'+(p>=70?'var(--ok)':'var(--bad)')+'">'+p+'%</div>'+
    '<div class="sub">'+plural(a,'acerto','acertos')+' e '+plural(e,'erro','erros')+' em '+plural(r.length,'questão','questões')+
    (pul.length?' · '+plural(pul.length,'pulada','puladas'):'')+'</div>'+
    '<div class="bar" style="margin-top:18px"><i class="ok" style="width:'+(r.length?a*100/r.length:0)+'%"></i><i class="bad" style="width:'+(r.length?e*100/r.length:0)+'%"></i></div>'+
    '<div class="row" style="justify-content:center;margin-top:22px;flex-wrap:wrap;gap:9px">'+
    (e?'<button class="btn gold" data-a="refazerErradas">Refazer só as erradas</button>':'')+
    (pul.length?'<button class="btn gold" data-a="refazerPuladas">Refazer as puladas</button>':'')+
    '<button class="btn primary" data-a="voltarPratica">Nova rodada</button></div></div>';
  if(e){
    h+='<div class="sec" style="margin-top:28px"><span class="eyebrow">Questões que você errou</span></div>';
    h+=listaQuestoes(r.filter(function(x){return !x.ok}).map(function(x){return qst(x.id)}).filter(Boolean));
  }
  if(pul.length){
    h+='<div class="sec" style="margin-top:28px"><span class="eyebrow">Questões que você pulou</span></div>';
    h+=listaQuestoes(pul.map(function(id){return qst(id);}).filter(Boolean));
  }
  return h+'</div>';
}

/* ---------- números ---------- */
function vStats(){
  var st=stat(S.questoes), seq=0;
  for(var i=S.hist.length-1;i>=0;i--){if(S.hist[i].c)seq++;else break;}
  var h='<div class="kpis">'+
    '<div class="kpi"><div class="n mono">'+S.questoes.length+'</div><div class="l">Questões cadastradas</div></div>'+
    '<div class="kpi"><div class="n mono">'+st.t+'</div><div class="l">Respostas dadas</div></div>'+
    '<div class="kpi"><div class="n mono" style="color:'+(st.p===null?'var(--navy)':(st.p>=70?'var(--ok)':'var(--bad)'))+'">'+(st.p===null?'—':st.p+'%')+'</div><div class="l">Acerto geral</div></div>'+
    '<div class="kpi"><div class="n mono">'+seq+'</div><div class="l">Sequência de acertos</div></div></div>';
  var dias=[],ag=new Date();
  for(var d=13;d>=0;d--) dias.push(dia(new Date(ag.getTime()-d*86400000)));
  var cont={}; S.hist.forEach(function(r){cont[r.d]=(cont[r.d]||0)+1;});
  var max=1; dias.forEach(function(k){max=Math.max(max,cont[k]||0);});
  h+='<div class="card" style="margin-top:16px"><div class="row" style="margin-bottom:14px"><span class="eyebrow">Questões respondidas por dia</span>'+
     '<span class="sub" style="margin-left:auto">últimos 14 dias · pico de '+max+'</span></div><div class="spark">';
  dias.forEach(function(k){var v=cont[k]||0;h+='<div class="'+(v?'':'z')+'" style="height:'+Math.max(2,Math.round(v*100/max))+'%" title="'+k+': '+v+'"></div>';});
  h+='</div><div class="axis"><span>'+dias[0].slice(8)+'/'+dias[0].slice(5,7)+'</span><span>hoje</span></div></div>';
  if(S.materias.length){
    h+='<div class="sec" style="margin-top:28px"><span class="eyebrow">Desempenho por matéria</span></div><div class="list">';
    S.materias.forEach(function(m){
      var s=stat(qsDe(m.id)),tot=s.t||1;
      h+='<button class="li" data-a="abrirMateria" data-id="'+m.id+'"><span class="st-name">'+esc(m.nome)+'</span>'+
        '<span class="grow st-bar"><span class="bar"><i class="ok" style="width:'+(s.a*100/tot)+'%"></i><i class="bad" style="width:'+(s.e*100/tot)+'%"></i></span></span>'+
        '<span class="sub st-num">'+(s.t?s.a+' ✓ · '+s.e+' ✗':'sem respostas')+'</span>'+
        '<span class="pill st-pct '+(s.p===null?'':(s.p>=70?'ok':'bad'))+'">'+(s.p===null?'—':s.p+'%')+'</span></button>';
    });
    h+='</div>';
  }
  var alvo=S.questoes.filter(function(q){return ((q.acertos||0)+(q.erros||0))>=2&&(q.erros||0)>=(q.acertos||0);})
    .sort(function(a,b){return (b.erros||0)-(a.erros||0);}).slice(0,6);
  if(alvo.length){
    h+='<div class="sec" style="margin-top:28px"><span class="eyebrow">Pedem atenção</span></div>'+listaQuestoes(alvo);
  }
  return h;
}

/* ---------- conta ---------- */
function travarGate(t,txt){var b=el('gBtn'); if(b){b.disabled=t;b.textContent=txt;}}
function msgAuth(e){
  var c=(e&&(e.code||e.message))||'';
  if(/invalid-credential|wrong-password|user-not-found|INVALID_LOGIN/i.test(c)) return 'E-mail ou senha incorretos';
  if(/invalid-email/i.test(c)) return 'E-mail inválido';
  if(/email-already-in-use/i.test(c)) return 'Esse e-mail já tem conta — é só entrar';
  if(/weak-password/i.test(c)) return 'A senha precisa de pelo menos 6 caracteres';
  if(/too-many-requests/i.test(c)) return 'Muitas tentativas seguidas — espere um pouco';
  if(/network|unavailable|offline/i.test(c)) return 'Sem internet agora';
  if(/operation-not-allowed|admin-restricted/i.test(c)) return 'Criação de conta desligada no Firebase';
  return 'Não deu para entrar — tente de novo';
}
function campos(){return {email:((el('gEmail')||{}).value||'').trim(),senha:(el('gSenha')||{}).value||''};}
function entrar(){
  if(!api) return erroGate('Ainda conectando… tente de novo em instantes');
  var c=campos();
  if(!c.email||!c.senha) return erroGate('Preencha e-mail e senha');
  erroGate(''); travarGate(true,'Entrando…');
  api.entrar(c.email,c.senha).then(function(){travarGate(false,'Entrar');},
    function(e){erroGate(msgAuth(e));travarGate(false,'Entrar');});
}
function criarConta(){
  if(!api) return erroGate('Ainda conectando… tente de novo em instantes');
  var c=campos();
  if(!c.email||!c.senha) return erroGate('Escreva o e-mail e uma senha para criar a conta');
  if(c.senha.length<6) return erroGate('A senha precisa de pelo menos 6 caracteres');
  erroGate(''); travarGate(true,'Criando…');
  api.criar(c.email,c.senha).then(function(){travarGate(false,'Entrar');},
    function(e){erroGate(msgAuth(e));travarGate(false,'Entrar');});
}
function esqueciSenha(){
  if(!api) return erroGate('Ainda conectando… tente de novo em instantes');
  var c=campos();
  if(!c.email) return erroGate('Escreva o e-mail primeiro');
  api.recuperar(c.email).then(function(){erroGate('Enviamos um link de nova senha para '+c.email,true);},
    function(e){erroGate(msgAuth(e));});
}

function exportar(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='estudos-do-pedrinho-'+dia()+'.json';
  document.body.appendChild(a);a.click();a.remove();toast('Arquivo de backup gerado');
}
function importar(f){
  var fr=new FileReader();
  fr.onload=function(){try{
    var d=normalizar(JSON.parse(fr.result)); if(!d.materias.length&&!d.questoes.length) throw 0;
    /* o backup vale mais que qualquer exclusão anterior: carimba tudo com a hora de agora
       e limpa as lápides desses ids, senão a mescla apagaria de novo o que voltou */
    var t=agora();
    ['materias','submaterias','questoes'].forEach(function(col){
      d[col].forEach(function(r){if(r&&r.id){r.atualizadoEm=t;delete S.apagados[r.id];delete d.apagados[r.id];}});
    });
    S=mesclar(S,d);
    salvar();raiz('materias');toast('Backup importado e juntado com o que já estava aqui');
  }catch(e){toast('Arquivo inválido');}};
  fr.readAsText(f);
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('[data-a]'):null;
  if(!b){ if(ev.target.id==='veil') fecharModal(); return; }
  var a=b.dataset.a, id=b.dataset.id, v=function(){var x=el('mdIn');return x?x.value.trim():'';};
  if(a==='tab') raiz(b.dataset.t);
  else if(a==='fecharModal') fecharModal();
  else if(a==='novaMateria') pedirTexto('Nova matéria','Nome da matéria','','criarMateria');
  else if(a==='criarMateria'){if(!v())return toast('Escreva um nome');S.materias.push(marcar({id:uid(),nome:v(),criadoEm:Date.now()}));salvar();fecharModal();desenhar();}
  else if(a==='abrirMateria') ir('materia',{id:id});
  else if(a==='renomearMateria'){atual().p.alvo=id;pedirTexto('Renomear matéria','Nome',mat(id).nome,'salvarNomeMateria');}
  else if(a==='salvarNomeMateria'){if(!v())return;marcar(mat(atual().p.alvo)).nome=v();salvar();fecharModal();desenhar();}
  else if(a==='pedirExcluirMateria') confirmar('Excluir matéria','Isso apaga também as submatérias, as anotações e todas as questões dela. Não dá para desfazer.','excluirMateria',id,'Excluir tudo');
  else if(a==='excluirMateria'){
    S.submaterias.forEach(function(s){if(s.materiaId===id)apagado(s.id);});
    S.questoes.forEach(function(q){if(q.materiaId===id)apagado(q.id);});
    apagado(id);
    S.submaterias=S.submaterias.filter(function(s){return s.materiaId!==id});
    S.questoes=S.questoes.filter(function(q){return q.materiaId!==id});
    S.materias=S.materias.filter(function(x){return x.id!==id});
    salvar();fecharModal();raiz('materias');}
  else if(a==='novaSub'){atual().p.alvo=b.dataset.mid;pedirTexto('Nova submatéria','Nome da submatéria','','criarSub');}
  else if(a==='criarSub'){if(!v())return toast('Escreva um nome');var ns=marcar({id:uid(),materiaId:atual().p.alvo,nome:v(),anotacoes:'',fmt:'html',criadoEm:Date.now()});
    S.submaterias.push(ns);salvar();fecharModal();trocar('materia',{id:ns.materiaId,sub:ns.id});}
  else if(a==='abrirSub') trocar('materia',{id:sbm(id).materiaId,sub:id});
  else if(a==='renomearSub'){atual().p.alvo=id;pedirTexto('Renomear submatéria','Nome',sbm(id).nome,'salvarNomeSub');}
  else if(a==='salvarNomeSub'){if(!v())return;marcar(sbm(atual().p.alvo)).nome=v();salvar();fecharModal();desenhar();}
  else if(a==='pedirExcluirSub') confirmar('Excluir submatéria','As anotações vão junto. As questões continuam na matéria, sem submatéria.','excluirSub',id);
  else if(a==='excluirSub'){var mid=sbm(id).materiaId;
    S.questoes.forEach(function(q){if(q.submateriaId===id){q.submateriaId=null;marcar(q);}});
    apagado(id);
    S.submaterias=S.submaterias.filter(function(x){return x.id!==id});
    salvar();fecharModal();trocar('materia',{id:mid});}
  else if(a==='filtro'){atual().p.filtro=id||null;desenhar();}
  else if(a==='novaQuestao'){rascunho=novoRascunho(b.dataset.mid,b.dataset.sid);abrirForm();}
  else if(a==='editarQuestao'){var q2=qst(id);if(q2){rascunho=JSON.parse(JSON.stringify(q2));abrirForm();}}
  else if(a==='tipo'){lerForm();rascunho.tipo=b.dataset.t;
    rascunho.alternativas = rascunho.tipo==='ce'
      ? [altNova(true,'Certo'),altNova(false,'Errado')]
      : [altNova(true),altNova(),altNova(),altNova()];
    abrirForm();}
  else if(a==='comentaPorAlt'){lerForm();rascunho.comentaPorAlt=b.dataset.v==='1';abrirForm();}
  else if(a==='correta'){lerForm();rascunho.alternativas.forEach(function(x,i){x.correta=(i===+b.dataset.i);});abrirForm();}
  else if(a==='addAlt'){lerForm();rascunho.alternativas.push(altNova());abrirForm();}
  else if(a==='tirarAlt'){lerForm();rascunho.alternativas.splice(+b.dataset.i,1);
    if(!rascunho.alternativas.some(function(x){return x.correta})) rascunho.alternativas[0].correta=true;abrirForm();}
  else if(a==='salvarQuestao'){
    lerForm();
    if(!String(rascunho.enunciado).trim()) return toast('Escreva o enunciado');

    if(cheias.length<2) return toast('Preencha ao menos duas alternativas');
    if(!cheias.some(function(x){return x.correta})) return toast('Marque qual alternativa é a certa');
    rascunho.alternativas=cheias;
    if(rascunho.id){var o=qst(rascunho.id);
      if(o){['materiaId','submateriaId','tipo','enunciado','comentario','fonte','alternativas','comentaPorAlt'].forEach(function(k){o[k]=rascunho[k];});marcar(o);}}
    else {rascunho.id=uid();rascunho.acertos=0;rascunho.erros=0;rascunho.criadoEm=Date.now();S.questoes.push(marcar(rascunho));}
    salvar();fecharModal();desenhar();toast('Questão salva');}
  else if(a==='pedirExcluirQuestao') confirmar('Excluir questão','A questão e o histórico dela somem de vez.','excluirQuestao',id);
  else if(a==='excluirQuestao'){apagado(id);S.questoes=S.questoes.filter(function(x){return x.id!==id});salvar();fecharModal();desenhar();}
  else if(a==='escopo'){setup.materiaId=id||null;setup.submateriaId=null;desenhar();}
  else if(a==='escopoSub'){setup.submateriaId=id||null;desenhar();}
  else if(a==='modo'){setup.modo=b.dataset.m;desenhar();}
  else if(a==='qtd'){setup.qtd=+b.dataset.n;desenhar();}
  else if(a==='comecar') comecar();
  else if(a==='praticarMateria'){setup.materiaId=id;setup.submateriaId=null;setup.modo='todas';comecar();}
  else if(a==='praticarSub'){setup.materiaId=sbm(id).materiaId;setup.submateriaId=id;setup.modo='todas';comecar();}
  else if(a==='responder'){if(sessao&&!sessao.resp) responder(id);}
  else if(a==='proxima') proxima();
  else if(a==='pular') pular();
  else if(a==='encerrar'){if(sessao&&(sessao.respostas.length||(sessao.puladas&&sessao.puladas.length))) trocar('resumo',{});else raiz('praticar');}
  else if(a==='refazerErradas') refazerErradas();
  else if(a==='refazerPuladas') refazerPuladas();
  else if(a==='voltarPratica') raiz('praticar');
  else if(a==='exportar') exportar();
  else if(a==='importar') el('fileIn').click();
  else if(a==='exemplo') exemplo();
  else if(a==='entrar') entrar();
  else if(a==='criarConta') criarConta();
  else if(a==='esqueciSenha') esqueciSenha();
  else if(a==='modoLocal'){modoLocal=true;try{localStorage.setItem(KEY_LOCAL,'1');}catch(e){}
    gate(false);status('off','só neste aparelho');toast('Dá para entrar depois pelo ⚙ / Conta');}
  else if(a==='ajustes'||a==='conta') abrirAjustes();
  else if(a==='entrarAgora'){modoLocal=false;try{localStorage.removeItem(KEY_LOCAL);}catch(e){}
    fecharModal();
    if(api) gate(true); else toast('Sem conexão com a nuvem agora');}
  else if(a==='sincronizar'){enviarNuvem();fecharModal();toast('Sincronizando…');}
  else if(a==='sair') sairConta();
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='fMat'){lerForm();rascunho.submateriaId=null;abrirForm();}
  if(ev.target.id==='fileIn'&&ev.target.files[0]) importar(ev.target.files[0]);
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='busca'){
    var p=atual().p; p.busca=ev.target.value;
    var b=p.busca.toLowerCase(), lista=p.filtro?qsDe(p.filtro):S.questoes.slice();
    if(b) lista=lista.filter(function(q){return String(q.enunciado).toLowerCase().indexOf(b)>=0;});
    var alvo=el('qlist'); if(alvo) alvo.innerHTML=lista.length?listaQuestoes(lista):
      '<div class="empty"><div class="big">Nada encontrado</div><p>Tente outras palavras do enunciado.</p></div>';}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&modal) return fecharModal();
  if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.enter){
    var alvo=document.querySelector('[data-a="'+ev.target.dataset.enter+'"]'); if(alvo){ev.preventDefault();alvo.click();} return;}
  if(modal) return;
  var tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||ev.target.isContentEditable) return;
  if(atual().v!=='sessao'||!sessao) return;
  if(!sessao.resp){
    var i=-1;
    if(/^[1-5]$/.test(ev.key)) i=+ev.key-1;
    else if(/^[a-eA-E]$/.test(ev.key)) i=LETRAS.indexOf(ev.key.toUpperCase());
    if(i>=0&&i<sessao.ordem.length){ev.preventDefault();responder(sessao.ordem[i].id);}
    else if(ev.key==='s'||ev.key==='S'){ev.preventDefault();pular();}
  } else if(ev.key==='Enter'||ev.key===' '||ev.key==='ArrowRight'){ev.preventDefault();proxima();}
});
[].forEach.call(document.querySelectorAll('.nav button'),function(b){b.addEventListener('click',function(){raiz(b.dataset.tab);});});
window.addEventListener('beforeunload',guardarComCuidado);
/* no celular a aba costuma ser congelada em vez de fechada */
document.addEventListener('visibilitychange',function(){if(document.hidden){guardarComCuidado();enviarNuvem();}});
/* duas abas abertas no mesmo navegador conversam na hora */
window.addEventListener('storage',function(ev){
  if(ev.key!==KEY||!ev.newValue) return;
  try{S=mesclar(S,JSON.parse(ev.newValue));}catch(e){return;}
  if(!editando()) desenhar();
});

carregar();
})();

<!-- Sincronização: fica num módulo separado de propósito. Se o Firebase não
     carregar (sem internet, rede bloqueada), o app acima continua funcionando
     normalmente, só que salvando apenas neste aparelho. -->
<script type="module">
const Sync = window.EstudosSync;
try{
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
  const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
          sendPasswordResetEmail, signOut, setPersistence, browserLocalPersistence }
    = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
  const { getFirestore, doc, getDoc, setDoc, onSnapshot }
    = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js');

  const app = initializeApp({
    apiKey: "AIzaSyDRfLlhKYYQHaeOKtMm5nujll4wk6R7NVo",
    authDomain: "estudos-concurso-9ed60.firebaseapp.com",
    projectId: "estudos-concurso-9ed60",
    storageBucket: "estudos-concurso-9ed60.firebasestorage.app",
    messagingSenderId: "579131698400",
    appId: "1:579131698400:web:80e421d99ec6387204f485"
  });
  const auth = getAuth(app), db = getFirestore(app);
  const ANTIGO = ['estudos','dados'];        /* onde os dados moravam antes */
  let alvo = null, parar = null;

  /* o login continua valendo depois de fechar o navegador */
  try{ await setPersistence(auth, browserLocalPersistence); }catch(e){}

  const limpo = d => JSON.parse(JSON.stringify(d));   /* Firestore não aceita undefined */

  Sync.pronto({
    entrar:    (email,senha) => signInWithEmailAndPassword(auth,email,senha),
    criar:     (email,senha) => createUserWithEmailAndPassword(auth,email,senha),
    recuperar: (email)       => sendPasswordResetEmail(auth,email),
    sair:      ()            => signOut(auth),
    enviar:    (dados)       => alvo ? setDoc(alvo,limpo(dados)) : Promise.reject(new Error('sem destino'))
  });

  onAuthStateChanged(auth, async user => {
    if(parar){ parar(); parar=null; }
    alvo = null;
    Sync.auth(user ? {email:user.email, uid:user.uid} : null);
    if(!user) return;

    /* cada conta tem o seu documento; se as regras do projeto não deixarem,
       cai no documento único antigo, que é onde os dados já estavam */
    let ref = doc(db,'usuarios',user.uid), migrar = false;
    try{
      migrar = !(await getDoc(ref)).exists();
    }catch(e){
      if(e && e.code === 'permission-denied'){ ref = doc(db,...ANTIGO); migrar = false; }
    }
    alvo = ref;

    if(migrar){
      try{
        const velho = await getDoc(doc(db,...ANTIGO));
        if(velho.exists()){ Sync.dados(velho.data()); Sync.forcarEnvio(); }
      }catch(e){}
    }

    parar = onSnapshot(ref, snap => {
      if(snap.metadata.hasPendingWrites) return;      /* eco da escrita que acabamos de fazer */
      Sync.dados(snap.exists() ? snap.data() : null);
    }, err => {
      if(err && err.code === 'permission-denied' && alvo !== null && ref.path !== ANTIGO.join('/')){
        alvo = doc(db,...ANTIGO);
        parar = onSnapshot(alvo, s => { if(!s.metadata.hasPendingWrites) Sync.dados(s.exists()?s.data():null); }, () => Sync.falhou());
      } else Sync.falhou();
    });
  });
}catch(e){
  if(Sync) Sync.falhou();
}
</script>
